yamlname: Auto Sports News Bot

on:
  schedule:
    - cron: '0 * * * *'   # 1時間おき（毎時0分）に自動実行
  workflow_dispatch:        # 管理画面から手動起動するためのボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests

      - name: Run main script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIVEDOOR_BLOG_ID: ${{ secrets.LIVEDOOR_BLOG_ID }}
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
        run: python main.py

      - name: Commit and Push processed_urls.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"
          git add processed_urls.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed_urls.txt [skip ci]" && git push)

下の 「Commit changes...」 で保存する。


続けて main.py の中身も確認してください。 おそらくこちらには逆にYAMLの中身（または空、もしくは何か別のもの）が入ってしまっている可能性があります。

左サイドバーで main.py をクリックして開く。
中身が Python コード（import os から始まって if __name__ == "__main__": で終わる、260行くらいのもの）になっているか確認する。
もしYAMLの中身や空になっていたら、鉛筆アイコンで編集し、以前渡した 完全版のmain.pyのコード（AtomPub API版）を丸ごと貼り付けて保存してください。

main.pyの中身が今どうなっているか、スクリーンショットか中身のコピーを送ってもらえれば、正しく入っているか確認します。
